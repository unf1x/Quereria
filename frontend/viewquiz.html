<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр квиза</title>

  <!-- Стили -->
  <link rel="stylesheet" href="../../../../../OneDrive/Документы/GitHub/Quereria/frontend/css/base.css">
  <link rel="stylesheet" href="../../../../../OneDrive/Документы/GitHub/Quereria/frontend/css/header.css">
  <link rel="stylesheet" href="../../../../../OneDrive/Документы/GitHub/Quereria/frontend/css/waitingroom.css">
  <link rel="stylesheet" href="../../../../../OneDrive/Документы/GitHub/Quereria/frontend/css/viewquiz.css">

  <!-- Шрифты -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rufina:wght@700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="left-block">
      <div class="logo">Q</div>
      <div class="burger" id="burger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <nav class="menu" id="menu">
      <a href="indexaboba.html" class="menu-item">Главная</a>
      <a href="history.html" class="menu-item">История</a>
      <a href="index.html" class="menu-item">Создание</a>
      <a href="help.html" class="menu-item">Помощь</a>
    </nav>

    <div class="profile" id="profileBtn"></div>
  </header>

  <!-- MAIN -->
  <div class="main">

    <!-- ЛЕВАЯ ЧАСТЬ -->
    <div class="quiz-info">
      <h2 id="quizTitle">Исторический батл</h2>

      <p class="label">Описание:</p>
      <p id="quizDescription">
        Квиз предназначен для проверки базовых знаний по мировой истории.
      </p>

      <p class="label">Количество вопросов:</p>
      <p id="quizQuestions">3</p>

      <p class="label">Время прохождения:</p>
      <p id="quizTime">1 мин 15 сек</p>

      <p class="label">Вид квиза:</p>
      <p id="quizType">Тест</p>
    </div>

    <!-- ПРАВАЯ ЧАСТЬ -->
    <div class="right">
      <img class="quiz-image"
           src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da"
           alt="quiz image">

      <div class="author" id="quizAuthor">
        Автор: Чуракова Диана
      </div>

      <!-- Ссылка -->
      <div class="link-block">
        <input type="text" id="quizLink"
               value="https://quizter.com/quiz/123456"
               readonly>

        <div class="copy-icon" id="copyLinkBtn" title="Копировать ссылку">
          <img src="copy-icon.png" class="icon" alt="copy">
        </div>
      </div>

      <!-- Код -->
      <div class="code-block">
        <span>Код квиза:</span>

        <div class="code" id="quizCode">1234567</div>

        <div class="code-copy-icon" id="copyCodeBtn" title="Копировать код">
          <img src="copy-icon.png" class="icon" alt="copy">
        </div>
      </div>
    </div>
  </div>

  <!-- КНОПКИ -->
  <div class="organizer-controls">
    <div class="left-controls">
      <button class="btn start-btn" id="editQuizBtn">
        Редактировать
      </button>

      <button class="trash-btn" id="deleteQuizBtn">
        <img src="trash.png" alt="Удалить" class="trash-icon">
      </button>
    </div>

    <button class="btn start-btn" id="launchQuizBtn">
      Запустить квиз
    </button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Скопировано!</div>

  <!-- JS -->
  <script src="../../../../../OneDrive/Документы/GitHub/Quereria/frontend/js/header.js" type="module"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        // Копирование ссылки
        document.getElementById('copyLinkBtn').addEventListener('click', async () => {
            const text = document.getElementById('quizLink').value;
            await navigator.clipboard.writeText(text);
            showToast('Ссылка скопирована!');
        });

        // Копирование кода
        document.getElementById('copyCodeBtn').addEventListener('click', async () => {
            const text = document.getElementById('quizCode').textContent;
            await navigator.clipboard.writeText(text);
            showToast('Код скопирован!');
        });

        // Редактировать
        document.getElementById('editQuizBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // Удалить
        document.getElementById('deleteQuizBtn').addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите удалить этот квиз?')) {
                alert('Квиз удалён!');
            }
        });

        // Запустить
        document.getElementById('launchQuizBtn').addEventListener('click', () => {
            window.location.href = 'waitingroom.html';
        });

    });
  </script>

</body>
</html>
